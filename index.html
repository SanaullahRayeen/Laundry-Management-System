<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code by Hashira - Laundry Management System</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Code by Hashira</h1>
        <p>Smart Laundry Order Management System</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Add New Laundry Order</h2>

            <form id="orderForm">

                <label for="customerName">Customer Name</label>
                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required
                >

                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="garment">Garment Category</label>
                <select id="garment" required>
                    <option value="">Select garment</option>
                    <option value="Shirt">Shirt</option>
                    <option value="T-Shirt">T-Shirt</option>
                    <option value="Pant">Pant</option>
                    <option value="Jeans">Jeans</option>
                    <option value="Bedsheet">Bedsheet</option>
                    <option value="Other">Other</option>
                </select>

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >

                <label for="service">Laundry Service</label>
                <select id="service" required>
                    <option value="">Select service</option>
                    <option value="Washing">Washing</option>
                    <option value="Dry Cleaning">Dry Cleaning</option>
                    <option value="Ironing">Ironing</option>
                    <option value="Washing + Ironing">Washing + Ironing</option>
                </select>

                <button type="submit">Add Order</button>

            </form>
        </section>

        <section class="orders-section">
            <h2>Laundry Order List</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer Name</th>
                            <th>Mobile Number</th>
                            <th>Garment</th>
                            <th>Quantity</th>
                            <th>Service</th>
                            <th>Order Date</th>
                            <th>Order Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="orderList">
                        <!-- Orders will appear here using JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Code by Hashira | CSE326 Project</p>
    </footer>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
